<div class="main-full-div" style="position: relative">
  <div *ngIf="loading" class="loader-background"></div>
  <p-progress-spinner
    strokeWidth="8"
    fill="transparent"
    animationDuration=".5s"
    [style]="{
      width: '70px',
      height: '70px',
      position: 'fixed',
      top: '50%',
      left: '50%',
      zIndex: 1000,
    }"
    *ngIf="loading"
  />
  <div class="app-globe">
    <p-button
      icon="pi pi-globe"
      (click)="menu.toggle($event)"
      [rounded]="true"
      severity="secondary"
    >
    </p-button>
  </div>
  <p-menu #menu [model]="languages" [popup]="true"></p-menu>
  <div class="login-table">
    <div class="center-image">
      <img
        src="assets/images/SmartNavLogo.png"
        alt="SmartNav Logo"
        style="max-width: 350px; width: 100%"
        height="400"
      />
    </div>
    <form [formGroup]="recoveryForm" (ngSubmit)="$event.preventDefault()">
      <div style="font-size: 1rem; margin: 3rem 0 0.5rem 0.3rem; font-weight: bold">
        {{ 'RECOVERY_EMAIL_LABEL' | translate }}
      </div>

      <div style="margin-bottom: 1rem">
        <p-floatlabel variant="on">
          <input pInputText style="width: 100%" id="email" type="text" formControlName="email" />
          <label for="email">Email</label>
        </p-floatlabel>
        <div *ngIf="recoveryForm.controls['email'].invalid && !recoveryForm.controls['email'].untouched">
          <small style="color: red" *ngIf="recoveryForm.controls['email'].hasError('required')">
            {{ 'EMAIL_REQUIRED' | translate }}
          </small>
          <small style="color: red" *ngIf="recoveryForm.controls['email'].hasError('email')">
            {{ 'EMAIL_INVALID' | translate }}
          </small>
        </div>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem">
        <a class="back-to-login" routerLink="/login">
          <i class="pi pi-arrow-left"></i> {{ 'RECOVERY_BACK_TO_LOGIN' | translate }}
        </a>
      </div>

      <div style="display: flex; justify-content: center; align-items: center; margin-bottom: 0.6rem">
        <p-toast />
        <button
          pButton
          class="fb-gl-buttons"
          type="button"
          (click)="submitTemporaryPassword()"
          [disabled]="recoveryForm.invalid || loading"
        >
          {{ 'RECOVERY_SEND_TEMP' | translate }} <i class="pi pi-arrow-right"></i>
        </button>
      </div>

      <div style="display: flex; justify-content: center; align-items: center; margin-bottom: 1rem">
        <button
          pButton
          class="fb-gl-buttons secondary-action"
          type="button"
          (click)="submitResetLink()"
          [disabled]="recoveryForm.invalid || loading"
        >
          {{ 'RECOVERY_SEND_LINK' | translate }} <i class="pi pi-link"></i>
        </button>
      </div>

      <div class="legend-container">
        <p class="legend">{{ 'RECOVERY_INFO_TEXT' | translate }}</p>
      </div>
    </form>
  </div>
</div>
