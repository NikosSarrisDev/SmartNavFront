<app-home>
  <div class="centerfy" spinner>
    <p-progress-spinner
      strokeWidth="8"
      fill="transparent"
      animationDuration=".5s"
      [style]="{ width: '70px', height: '70px', diplay: 'flex' }"
      *ngIf="loading()"
    />
  </div>
  <ng-container globe>
    <div class="header-actions">
      <div class="app-globe">
        <p-button
          icon="pi pi-filter"
          (click)="navigateToFilters()"
          [rounded]="true"
          severity="secondary"
        >
        </p-button>
      </div>
      <div class="app-globe">
        <p-button
          icon="pi pi-globe"
          (click)="menu.toggle($event)"
          [rounded]="true"
          severity="secondary"
        >
        </p-button>
      </div>
    </div>
  </ng-container>
  <p-menu menu #menu [model]="languages" [popup]="true"></p-menu>
</app-home>
