# azure-pipelines-frontend.yml

trigger:
  branches:
    include:
      - main
      - master
      - develop
  paths:
    include:
      - '**'
      - azure-pipelines-frontend.yml

pr:
  branches:
    include:
      - main
      - master
      - develop
  paths:
    include:
      - '**'
      - azure-pipelines-frontend.yml

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: '20.x'
  # Αν το package.json είναι στο root του repo, άφησέ το '.'
  # Αν είναι σε υποφάκελο (π.χ. SmartNav), άλλαξέ το.
  frontendRoot: '.'
  buildConfiguration: 'development'

steps:
  - checkout: self
    clean: true
    fetchDepth: 1

  # Debug για να βλέπεις paths στον agent
  - script: |
      echo "PWD:"
      pwd
      echo "Repo root files:"
      ls -la
      echo "Find package-lock.json (maxdepth 4):"
      find . -maxdepth 4 -name package-lock.json
    displayName: 'Debug repo paths'

  - task: NodeTool@0
    displayName: 'Use Node.js $(nodeVersion)'
    inputs:
      versionSpec: $(nodeVersion)

  - task: Cache@2
    displayName: 'Cache npm'
    inputs:
      key: 'npm | "$(Agent.OS)" | $(frontendRoot)/package-lock.json'
      restoreKeys: |
        npm | "$(Agent.OS)"
      path: '$(Pipeline.Workspace)/.npm'

  - script: npm ci
    displayName: 'Install dependencies'
    workingDirectory: $(frontendRoot)
    env:
      npm_config_cache: $(Pipeline.Workspace)/.npm

  - script: npm run build -- --configuration $(buildConfiguration)
    displayName: 'Build Angular'
    workingDirectory: $(frontendRoot)

  - task: PublishBuildArtifacts@1
    displayName: 'Publish frontend artifact'
    inputs:
      # Για Angular application builder το output είναι συνήθως dist/<app>/browser
      PathtoPublish: '$(Build.SourcesDirectory)/$(frontendRoot)/dist/SmartNav'
      ArtifactName: 'frontend'
      publishLocation: 'Container'
