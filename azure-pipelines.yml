trigger:
  branches:
    include: [main, master, develop]
  paths:
    include:
      - SmartNavFront/**
      - azure-pipelines-frontend.yml

pr:
  branches:
    include: [main, master, develop]
  paths:
    include:
      - SmartNavFront/**
      - azure-pipelines-frontend.yml

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: '20.x'
  frontendRoot: 'SmartNavFront/SmartNav'
  buildConfiguration: 'development' # βάλε production όταν φτιάξεις τα Angular budgets

steps:
  - checkout: self
    clean: true

  - task: NodeTool@0
    inputs:
      versionSpec: $(nodeVersion)
    displayName: 'Use Node.js $(nodeVersion)'

  - task: Cache@2
    inputs:
      key: 'npm | "$(Agent.OS)" | $(frontendRoot)/package-lock.json'
      restoreKeys: |
        npm | "$(Agent.OS)"
      path: '$(Pipeline.Workspace)/.npm'
    displayName: 'Cache npm'

  - script: npm ci
    workingDirectory: $(frontendRoot)
    env:
      npm_config_cache: $(Pipeline.Workspace)/.npm
    displayName: 'Install dependencies'

  - script: npm run build -- --configuration $(buildConfiguration)
    workingDirectory: $(frontendRoot)
    displayName: 'Build Angular'

  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: '$(frontendRoot)/dist/SmartNav'
      ArtifactName: frontend
      publishLocation: Container
    displayName: 'Publish frontend artifact'
