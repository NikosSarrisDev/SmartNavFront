# azure-pipelines-frontend.yml

trigger:
  branches:
    include:
      - main
      - master
      - develop
  paths:
    include:
      - SmartNavFront/**
      - azure-pipelines-frontend.yml

pr:
  branches:
    include:
      - main
      - master
      - develop
  paths:
    include:
      - SmartNavFront/**
      - azure-pipelines-frontend.yml

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: '20.x'
  frontendRoot: 'SmartNavFront/SmartNav'
  buildConfiguration: 'development'

steps:
- checkout: self
  clean: true
  fetchDepth: 1

- script: |
    echo "PWD:"
    pwd
    echo "Repo root:"
    ls -la
    echo "Check frontendRoot:"
    ls -la $(frontendRoot)
    echo "Find package-lock.json:"
    find . -maxdepth 4 -name package-lock.json
  displayName: 'Debug paths'

- task: NodeTool@0
  displayName: 'Use Node.js $(nodeVersion)'
  inputs:
    versionSpec: $(nodeVersion)

- task: Cache@2
  displayName: 'Cache npm'
  inputs:
    key: 'npm | "$(Agent.OS)" | $(frontendRoot)/package-lock.json'
    restoreKeys: |
      npm | "$(Agent.OS)"
    path: '$(Pipeline.Workspace)/.npm'

- script: npm ci
  displayName: 'Install dependencies'
  workingDirectory: $(frontendRoot)
  env:
    npm_config_cache: $(Pipeline.Workspace)/.npm

# environment.ts είναι ignored στο git, άρα το δημιουργούμε στο CI
- script: |
    mkdir -p src/environments
    cat > src/environments/environment.ts << 'EOF'
    export const environment = {
      production: false,
      googleMapsApiKey: '$(GOOGLE_MAPS_API_KEY)',
      geminiApiKey: '$(GEMINI_API_KEY)'
    };
    EOF
    echo "Generated src/environments/environment.ts"
  displayName: 'Create environment.ts from pipeline secrets'
  workingDirectory: $(frontendRoot)

- script: npm run build -- --configuration $(buildConfiguration)
  displayName: 'Build Angular'
  workingDirectory: $(frontendRoot)

- task: PublishBuildArtifacts@1
  displayName: 'Publish frontend artifact'
  inputs:
    PathtoPublish: '$(Build.SourcesDirectory)/$(frontendRoot)/dist/SmartNav'
    ArtifactName: 'frontend'
    publishLocation: 'Container'